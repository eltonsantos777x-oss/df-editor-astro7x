<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ASTRO7X // WORD CONVERTER v6.0</title>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root { --neon: #00ff41; --bg: #050505; }
        body { background: var(--bg); color: var(--neon); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #121212; border-bottom: 1px solid var(--neon); padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        #editor-workspace { flex: 1; background: #1a1a1a; overflow: auto; padding: 40px; display: flex; justify-content: center; position: relative; }
        #text-layer { position: absolute; background: white; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .editable-field { position: absolute; border: 1px solid transparent; color: black; background: rgba(255,255,255,0.8); cursor: text; outline: none; white-space: nowrap; font-weight: bold; }
        .editable-field:hover { border: 1px solid #007bff; background: white; }
        .editable-field:focus { border: 1px solid var(--neon); background: white; z-index: 1000; }
        .btn { background: transparent; color: var(--neon); border: 1px solid var(--neon); padding: 10px 20px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn:hover { background: var(--neon); color: black; }
        #drop-zone { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

    <div id="drop-zone">
        <h1>GHOST WORD CONVERTER v6.0</h1>
        <button class="btn" onclick="document.getElementById('file-input').click()">Converter PDF para Word</button>
        <input type="file" id="file-input" accept="application/pdf" style="display:none">
    </div>

    <header>
        <div style="font-weight: bold;">ASTRO7X // MODO WORD ATIVADO</div>
        <div>
            <span id="file-name" style="margin-right: 20px; font-size: 0.8rem; color: #888;"></span>
            <button class="btn" onclick="exportToPDF()">Converter de volta para PDF</button>
        </div>
    </header>

    <main id="editor-workspace">
        <div id="text-layer">
            <!-- Os campos editáveis do Word aparecem aqui -->
        </div>
    </main>

    <script>
        let pdfBytes = null;
        let fields = [];
        const textLayer = document.getElementById('text-layer');
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        document.getElementById('file-input').onchange = async (e) => {
            const file = e.target.files[0];
            document.getElementById('file-name').innerText = file.name;
            pdfBytes = await file.arrayBuffer();
            document.getElementById('drop-zone').style.display = 'none';
            convertToEditable();
        };

        async function convertToEditable() {
            const loadingTask = pdfjsLib.getDocument(pdfBytes);
            const pdf = await loadingTask.promise;
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({ scale: 1.5 });
            
            textLayer.style.width = viewport.width + 'px';
            textLayer.style.height = viewport.height + 'px';

            const textContent = await page.getTextContent();
            
            textContent.items.forEach(item => {
                const field = document.createElement('div');
                field.className = 'editable-field';
                field.contentEditable = "true";
                
                // Posicionamento preciso baseado no PDF original
                const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
                field.style.left = tx[4] + 'px';
                field.style.top = (viewport.height - tx[5] - (item.height * 1.5)) + 'px';
                field.style.fontSize = (item.height * 1.5) + 'px';
                field.innerText = item.str;
                
                textLayer.appendChild(field);
                fields.push({ element: field, original: item });
            });
        }

        async function exportToPDF() {
            const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
            const page = pdfDoc.getPages()[0];
            const { width, height } = page.getSize();
            const font = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
            
            // Fator de escala para voltar ao tamanho real
            const scale = width / parseFloat(textLayer.style.width);

            fields.forEach(f => {
                const rect = f.element.getBoundingClientRect();
                const layerRect = textLayer.getBoundingClientRect();
                
                const x = (rect.left - layerRect.left) * scale;
                const y = height - ((rect.top - layerRect.top) * scale) - (f.original.height * scale);

                // "Apaga" o fundo original e escreve o novo (Conversão Final)
                page.drawRectangle({
                    x: x, y: y,
                    width: f.element.offsetWidth * scale,
                    height: f.original.height * scale,
                    color: PDFLib.rgb(1, 1, 1)
                });

                page.drawText(f.element.innerText, {
                    x: x, y: y,
                    size: f.original.height * scale,
                    font: font,
                    color: PDFLib.rgb(0, 0, 0)
                });
            });

            const finalBytes = await pdfDoc.save();
            const blob = new Blob([finalBytes], { type: "application/pdf" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "DOC_FINAL_SUPREME.pdf";
            link.click();
        }
    </script>
</body>
</html>
