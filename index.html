<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ASTRO7X // GHOST SNIPER v7.0</title>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root { --neon: #00ff41; --bg: #050505; }
        body { background: var(--bg); color: var(--neon); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #121212; border-bottom: 1px solid var(--neon); padding: 10px 20px; display: flex; justify-content: space-between; }
        #workspace { flex: 1; overflow: auto; display: flex; justify-content: center; background: #1a1a1a; padding: 20px; }
        canvas { background: white; cursor: text; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .btn { background: transparent; color: var(--neon); border: 1px solid var(--neon); padding: 10px; cursor: pointer; font-weight: bold; }
        #drop-zone { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

    <div id="drop-zone">
        <h1>GHOST SNIPER v7.0</h1>
        <button class="btn" onclick="document.getElementById('file-input').click()">SELECIONAR PDF</button>
        <input type="file" id="file-input" accept="application/pdf" style="display:none">
    </div>

    <header>
        <div style="font-weight:bold">ASTRO7X // MODO EDIÇÃO DIRETA</div>
        <button class="btn" onclick="savePDF()">BAIXAR FINAL (SEM MARCAS)</button>
    </header>

    <main id="workspace">
        <canvas id="pdf-canvas"></canvas>
    </main>

    <script>
        let pdfBytes = null;
        let edits = [];
        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        document.getElementById('file-input').onchange = async (e) => {
            pdfBytes = await e.target.files[0].arrayBuffer();
            document.getElementById('drop-zone').style.display = 'none';
            render();
        };

        async function render() {
            const pdf = await pdfjsLib.getDocument({data: pdfBytes}).promise;
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({ scale: 1.5 });
            canvas.width = viewport.width; canvas.height = viewport.height;
            await page.render({ canvasContext: ctx, viewport: viewport }).promise;

            edits.forEach(edit => {
                ctx.fillStyle = "white";
                ctx.fillRect(edit.x - 2, edit.y - 12, ctx.measureText(edit.text).width + 4, 15);
                ctx.fillStyle = "black";
                ctx.font = "bold 13px Arial";
                ctx.fillText(edit.text, edit.x, edit.y);
            });
        }

        canvas.onclick = (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const text = prompt("Novo texto para esta posição:");
            if (text) {
                edits.push({ x, y, text });
                render();
            }
        };

        async function savePDF() {
            const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
            const page = pdfDoc.getPages()[0];
            const { width, height } = page.getSize();
            const font = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
            const scaleX = width / canvas.width;
            const scaleY = height / canvas.height;

            edits.forEach(edit => {
                // Apaga o original (Whiteout)
                page.drawRectangle({
                    x: edit.x * scaleX,
                    y: height - (edit.y * scaleY) - 2,
                    width: edit.text.length * 6,
                    height: 10,
                    color: PDFLib.rgb(1, 1, 1)
                });
                // Escreve o novo com a fonte do CRLV
                page.drawText(edit.text, {
                    x: edit.x * scaleX,
                    y: height - (edit.y * scaleY),
                    size: 9,
                    font: font,
                    color: PDFLib.rgb(0, 0, 0)
                });
            });

            const final = await pdfDoc.save();
            const blob = new Blob([final], { type: "application/pdf" });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "editado_astro7x.pdf";
            a.click();
        }
    </script>
</body>
</html>
