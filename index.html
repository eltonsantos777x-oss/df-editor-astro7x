<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRO7X | Smart PDF Editor</title>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <style>
        :root { --neon: #00ff41; --bg: #0a0a0a; }
        body { background-color: var(--bg); color: var(--neon); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { border: 1px solid var(--neon); padding: 2rem; border-radius: 10px; box-shadow: 0 0 15px rgba(0, 255, 65, 0.2); text-align: center; max-width: 500px; }
        h1 { letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
        input[type="file"] { margin: 20px 0; border: 1px dashed var(--neon); padding: 10px; width: 100%; box-sizing: border-box; }
        button { background: transparent; color: var(--neon); border: 1px solid var(--neon); padding: 10px 25px; font-size: 1rem; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-weight: bold; }
        button:hover { background: var(--neon); color: black; box-shadow: 0 0 20px var(--neon); }
        .status { margin-top: 15px; font-size: 0.8rem; opacity: 0.7; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ghost PDF Editor</h1>
        <p>Edição local. Sem rastros. Estilo original.</p>
        
        <input type="file" id="upload" accept="application/pdf">
        <br>
        <button onclick="editarPDF()">Processar e Baixar</button>
        
        <div class="status" id="status">Aguardando arquivo...</div>
    </div>

    <script>
        async function editarPDF() {
            const input = document.getElementById('upload');
            const status = document.getElementById('status');
            
            if (input.files.length === 0) {
                alert("Selecione um PDF primeiro!");
                return;
            }

            status.innerText = "Processando Smart Font Matching...";

            try {
                const arrayBuffer = await input.files[0].arrayBuffer();
                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
                const pages = pdfDoc.getPages();
                const firstPage = pages[0];

                // Exemplo de Borragem e Edição (Smart Matching)
                // Aqui o script "limpa" a área e escreve com a fonte padrão do PDF
                const helveticaFont = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
                
                // 1. Borragem (Censura real)
                firstPage.drawRectangle({
                    x: 50, y: 700, width: 250, height: 20,
                    color: PDFLib.rgb(1, 1, 1), // Cobre com branco
                });

                // 2. Novo texto mantendo o padrão
                firstPage.drawText('CONTEUDO EDITADO - ASTRO7X', {
                    x: 55, y: 705, size: 12,
                    font: helveticaFont,
                    color: PDFLib.rgb(0, 0, 0),
                });

                const pdfBytes = await pdfDoc.save();
                
                // Gerar download local imediato
                const blob = new Blob([pdfBytes], { type: "application/pdf" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = "editado_localmente.pdf";
                a.click();
                
                status.innerText = "Concluído! Arquivo baixado localmente.";
            } catch (e) {
                status.innerText = "Erro ao processar. Verifique o arquivo.";
                console.error(e);
            }
        }
    </script>
</body>
</html>
