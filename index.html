<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ASTRO7X // SUPREME EDITOR v3.0</title>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root { --neon: #00ff41; --bg: #050505; --gray: #121212; }
        body { background: var(--bg); color: var(--neon); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: var(--gray); border-bottom: 1px solid var(--neon); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 0 15px rgba(0,255,65,0.2); }
        main { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: 280px; background: var(--gray); border-right: 1px solid var(--neon); padding: 20px; overflow-y: auto; }
        #editor-container { flex: 1; overflow: auto; padding: 30px; display: flex; justify-content: center; background: #1a1a1a; position: relative; }
        canvas { border: 1px solid #444; background: white; cursor: crosshair; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .btn { background: transparent; color: var(--neon); border: 1px solid var(--neon); padding: 12px; cursor: pointer; width: 100%; margin-bottom: 10px; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        .btn:hover { background: var(--neon); color: black; box-shadow: 0 0 15px var(--neon); }
        .tool-label { font-size: 0.7rem; color: #888; margin-bottom: 5px; display: block; }
        input[type="text"] { background: #000; border: 1px solid var(--neon); color: var(--neon); padding: 8px; width: 100%; margin-bottom: 10px; }
        #drop-zone { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

    <div id="drop-zone">
        <h1 style="letter-spacing: 5px;">GHOST SUPREME v3.0</h1>
        <button class="btn" style="width: 250px;" onclick="document.getElementById('file-input').click()">Carregar PDF Original</button>
        <input type="file" id="file-input" accept="application/pdf" style="display:none">
    </div>

    <header>
        <div style="font-weight: bold; letter-spacing: 2px;">ASTRO7X // SUPREME ENGINE</div>
        <button class="btn" style="width: auto; padding: 10px 30px;" onclick="savePDF()">Salvar PDF Limpo</button>
    </header>

    <main>
        <div id="sidebar">
            <span class="tool-label">MODO DE EDIÇÃO</span>
            <button class="btn" onclick="setMode('whiteout')">Borracha Branca (Limpar)</button>
            <button class="btn" onclick="setMode('text')">Injetar Texto Smart</button>
            
            <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
            
            <span class="tool-label">CONTEÚDO PARA INJEÇÃO</span>
            <input type="text" id="input-text" placeholder="Digite o novo texto...">
            <div id="status" style="font-size: 0.7rem; opacity: 0.6; font-family: monospace;">Aguardando ação...</div>
        </div>
        <div id="editor-container">
            <canvas id="pdf-render"></canvas>
        </div>
    </main>

    <script>
        let pdfFileBuffer = null;
        let edits = [];
        let mode = 'whiteout'; 
        let isDrawing = false;
        let startX, startY;
        
        const canvas = document.getElementById('pdf-render');
        const ctx = canvas.getContext('2d');
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        document.getElementById('file-input').onchange = async (e) => {
            const file = e.target.files[0];
            pdfFileBuffer = await file.arrayBuffer();
            document.getElementById('drop-zone').style.display = 'none';
            const loadingTask = pdfjsLib.getDocument(pdfFileBuffer);
            const pdf = await loadingTask.promise;
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({ scale: 2.0 }); // Alta definição para precisão
            
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            document.getElementById('status').innerText = "PDF Carregado. Pronto para Whiteout.";
        };

        function setMode(m) { mode = m; document.getElementById('status').innerText = "Modo: " + m.toUpperCase(); }

        canvas.onmousedown = (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
        };

        canvas.onmouseup = (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const endX = e.clientX - rect.left;
            const endY = e.clientY - rect.top;
            const textValue = document.getElementById('input-text').value;

            edits.push({
                type: mode,
                x: startX, y: startY,
                w: endX - startX, h: endY - startY,
                text: mode === 'text' ? textValue : null
            });

            // Feedback Visual no Canvas
            if (mode === 'whiteout') {
                ctx.fillStyle = 'white';
                ctx.fillRect(startX, startY, endX - startX, endY - startY);
            } else {
                ctx.fillStyle = 'black';
                ctx.font = "bold 14px Arial";
                ctx.fillText(textValue, startX, startY + 15);
            }

            isDrawing = false;
            document.getElementById('status').innerText = edits.length + " alterações pendentes.";
        };

        async function savePDF() {
            const pdfDoc = await PDFLib.PDFDocument.load(pdfFileBuffer);
            const page = pdfDoc.getPages()[0];
            const { width, height } = page.getSize();
            const font = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);

            const scaleX = width / canvas.width;
            const scaleY = height / canvas.height;

            for (const edit of edits) {
                if (edit.type === 'whiteout') {
                    page.drawRectangle({
                        x: edit.x * scaleX,
                        y: height - (edit.y * scaleY) - (edit.h * scaleY),
                        width: edit.w * scaleX,
                        height: edit.h * scaleY,
                        color: PDFLib.rgb(1, 1, 1),
                    });
                } else if (edit.type === 'text') {
                    // Primeiro apaga o fundo (Whiteout automático sob o texto)
                    page.drawRectangle({
                        x: edit.x * scaleX,
                        y: height - (edit.y * scaleY) - 15,
                        width: edit.text.length * 8, // Ajuste dinâmico
                        height: 15,
                        color: PDFLib.rgb(1, 1, 1),
                    });
                    page.drawText(edit.text, {
                        x: edit.x * scaleX,
                        y: height - (edit.y * scaleY) - 12,
                        size: 10, // Tamanho padrão dos CRLVs analisados
                        font: font,
                        color: PDFLib.rgb(0, 0, 0),
                    });
                }
            }

            // Geração limpa do arquivo sem metadados do projeto
            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: "application/pdf" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "documento_original_editado.pdf";
            link.click();
            document.getElementById('status').innerText = "SALVO COM SUCESSO.";
        }
    </script>
</body>
</html>
